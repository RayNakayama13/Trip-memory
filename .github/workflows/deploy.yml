name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/travel-memory-photo-service-ty988y
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は 1 つずつ。走行中のデプロイは止めずに、後から来たものを待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # プロジェクトページは https://<user>.github.io/<repo>/ に置かれるため、
        # そのサブパスを base に指定してビルドする
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # 事前に Settings > Pages の Source を "GitHub Actions" にしておく必要がある
      # （Pages の有効化は管理者権限が要る操作で、Actions のトークンでは行えない）
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
